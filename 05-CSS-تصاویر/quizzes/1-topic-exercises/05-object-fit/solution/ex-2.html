<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۲ — cover یا contain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
<link rel="stylesheet" href="ex-2.css">
</head>
<body>
  <div class="box">
    <h2>پیشنهاد روز</h2>
    <img class="thumb cover" src="../../../../images/food-1.jpg" alt="بشقاب کباب کوبیده" width="960" height="511">
    <p>اینجا پر بودن قاب مهم‌تر است؛ بریده شدن کناره‌ها اشکالی ندارد.</p>
  </div>

  <div class="box">
    <h2>جزئیات محصول</h2>
    <img class="thumb contain" src="../../../../images/food-1.jpg" alt="بشقاب سرامیکی کامل همراه با کباب" width="960" height="511">
    <p>مشتری باید کل بشقاب را ببیند؛ پس هیچ قسمتی نباید بریده شود.</p>
  </div>
</body>
</html>
