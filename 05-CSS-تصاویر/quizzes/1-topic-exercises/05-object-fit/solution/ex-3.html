<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۳ — object-position</title>
  <link rel="stylesheet" href="ex-3.css">
</head>
<body>
  <h1>کدام برش برای منو بهتر است؟</h1>

  <img class="wide pos-top" src="../../../../images/food-3.jpg" alt="چای سنتی، برش بالای عکس" width="960" height="1280">
  <p><code>object-position: center top</code></p>

  <img class="wide pos-center" src="../../../../images/food-3.jpg" alt="چای سنتی، برش وسط عکس" width="960" height="1280">
  <p><code>object-position: center center</code></p>

  <img class="wide pos-bottom" src="../../../../images/food-3.jpg" alt="چای سنتی، برش پایین عکس" width="960" height="1280">
  <p><code>object-position: center bottom</code></p>

  <h2>عکس پروفایل در قاب پهن</h2>
  <img class="wide pos-face" src="../../../../images/profile.jpg" alt="مدیر سالن رستوران" width="400" height="400">
  <p><code>object-position: center 20%</code></p>
</body>
</html>
