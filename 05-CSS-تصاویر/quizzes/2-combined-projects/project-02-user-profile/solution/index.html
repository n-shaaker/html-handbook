<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سارا رحیمی — پروفایل دستپخت</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="cover"></div>

  <main class="profile">
    <span class="avatar-wrap">
      <img class="avatar" src="../../../../images/profile.jpg" alt="سارا رحیمی" width="400" height="400">
      <span class="online" role="img" aria-label="آنلاین"></span>
    </span>

    <h1>سارا رحیمی</h1>
    <p class="bio">آشپز خانگی از شیراز؛ عاشق غذاهای سنتی و دسرهای ساده.</p>

    <ul class="stats">
      <li><strong>۳۴</strong> دستور پخت</li>
      <li><strong>۱۲۰۰</strong> دنبال‌کننده</li>
      <li><strong>۸۰</strong> دنبال‌شونده</li>
    </ul>

    <section class="recent">
      <h2>دستورهای اخیر</h2>
      <div class="recipe">
        <div class="thumb">
          <img src="../../../../images/food-1.jpg" alt="کباب کوبیده تابه‌ای با گوجه" width="960" height="511" loading="lazy">
        </div>
        <p>کباب تابه‌ای</p>
      </div>
      <div class="recipe">
        <div class="thumb">
          <img src="../../../../images/food-2.jpg" alt="زرشک‌پلو با مرغ زعفرانی" width="960" height="720" loading="lazy">
        </div>
        <p>زرشک‌پلو با مرغ</p>
      </div>
      <div class="recipe">
        <div class="thumb">
          <img class="tea" src="../../../../images/food-3.jpg" alt="چای دارچینی در استکان کمرباریک" width="960" height="1280" loading="lazy">
        </div>
        <p>چای دارچینی</p>
      </div>
    </section>
  </main>
</body>
</html>
