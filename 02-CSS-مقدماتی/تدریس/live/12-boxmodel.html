<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live — Box Model</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, "Vazirmatn", sans-serif;
      padding: 1.5rem;
      background: #f1f5f9;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-block: 1rem;
    }
    .box {
      width: 12rem;
      padding: 1rem;
      border: 4px solid #2563eb;
      margin: 0.5rem;
      background: #dbeafe;
      text-align: center;
      font-size: 0.875rem;
    }
    .box--content { box-sizing: content-box; }
    .box--border { box-sizing: border-box; }
    .field {
      display: block;
      width: 100%;
      max-width: 20rem;
      padding: 0.5rem 0.75rem;
      margin-block-start: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.375rem;
      font: inherit;
    }
    .field:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <h1>content-box در برابر border-box</h1>
  <p>هر دو <code>width: 12rem</code> — در DevTools عرض کل را مقایسه کنید.</p>
  <div class="row">
    <div class="box box--content">content-box</div>
    <div class="box box--border">border-box</div>
  </div>
  <label for="name">نام (Tab برای outline):</label>
  <input class="field" id="name" type="text" placeholder="فوکوس">
</body>
</html>
