  <body>
    <h1 id="news-title">افتتاح کتابخانه جدید در شهرک غرب</h1>
    <p class="note">تاریخ انتشار: ۱۲ آبان ۱۴۰۵</p>
    <p>کتابخانه جدید با ده هزار جلد کتاب از امروز درهای خود را به روی مردم باز کرد.</p>
    <div class="note">این خبر از روابط عمومی شهرداری دریافت شده است.</div>
    <h2>ساعت کار</h2>
    <p>همه روزها به‌جز جمعه، ۹ صبح تا ۷ عصر.</p>
    <h3>آدرس</h3>
    <p>شهرک غرب، بلوار دریا، پلاک ۴۰.</p>
