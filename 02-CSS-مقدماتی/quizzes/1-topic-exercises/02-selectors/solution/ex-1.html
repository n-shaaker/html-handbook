  <body>
    <h1>دستور پخت کوکو سبزی</h1>
    <h2>مواد لازم</h2>
    <p>سبزی کوکو نیم کیلو، تخم‌مرغ پنج عدد، گردو و زرشک به مقدار لازم.</p>
    <p class="tip">نکته: سبزی را کاملاً خشک کنید تا کوکو آب نیندازد.</p>
    <h2>طرز تهیه</h2>
    <p>سبزی خردشده را با تخم‌مرغ و ادویه مخلوط کنید و در تابه داغ بریزید.</p>
    <p class="tip">نکته: زیر شعله را کم کنید تا کوکو نسوزد.</p>
  </body>
