<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی سنگ، کاغذ، قیچی</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
<link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>

  <main class="card">
    <h1>سنگ، کاغذ، قیچی ✊✋✌️</h1>
    <p class="intro">هر کس زودتر به ۵ امتیاز برسد برنده است.</p>

    <div class="choices">
      <button type="button" class="btn" id="rock-btn">سنگ ✊</button>
      <button type="button" class="btn" id="paper-btn">کاغذ ✋</button>
      <button type="button" class="btn" id="scissors-btn">قیچی ✌️</button>
    </div>

    <section class="output" aria-live="polite">
      <p id="choices-out">یک گزینه را انتخاب کن.</p>
      <p id="round-out" class="round"></p>
      <p id="score-out" class="score">شما: 0 — کامپیوتر: 0 — مساوی: 0</p>
      <p id="final-out" class="highlight"></p>
    </section>

    <button type="button" class="btn btn-secondary" id="reset-btn">بازی جدید</button>
  </main>

</body>

</html>
