<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۳ — کارت محصول فروشگاه</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
<link rel="stylesheet" href="style.css">
  <script src="ex-3.js" defer></script>
</head>

<body>
  <main>
    <h1>فروشگاه لوازم ورزشی</h1>

    <label for="search">جست‌وجو</label>
    <input type="text" id="search" placeholder="مثلاً کفش">
    <p id="key-text" class="hint">آخرین کلید: —</p>

    <div class="product-card" id="product-card">
      <h2>کفش دویدن سبک</h2>
      <p>۲٬۸۰۰٬۰۰۰ تومان</p>
      <p id="card-hint" class="hint">ماوس را روی کارت ببرید</p>
      <button type="button" id="buy-btn">افزودن به سبد</button>
    </div>

    <p id="cart-text" class="result">سبد خرید: 0 کالا</p>
  </main>
</body>

</html>
