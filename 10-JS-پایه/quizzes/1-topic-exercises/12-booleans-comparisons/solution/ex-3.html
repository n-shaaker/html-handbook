<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۳ — بررسی زنده فرم ثبت‌نام</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
<link rel="stylesheet" href="style.css">
  <script src="ex-3.js" defer></script>
</head>

<body>
  <main>
    <h1>ثبت‌نام در سایت</h1>

    <label for="username">نام کاربری (حداقل ۳ حرف)</label>
    <input type="text" id="username" dir="ltr">

    <label for="password">رمز عبور (حداقل ۸ حرف، غیر از نام کاربری)</label>
    <input type="password" id="password" dir="ltr">

    <div class="result">
      <p id="user-out">نام کاربری معتبر: false</p>
      <p id="pass-out">رمز معتبر: false</p>
      <p id="allow-out">اجازه ثبت‌نام: false</p>
    </div>
  </main>
</body>

</html>
