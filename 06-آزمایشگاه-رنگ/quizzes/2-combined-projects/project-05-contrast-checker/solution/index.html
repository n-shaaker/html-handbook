<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بررسی‌کننده کنتراست رنگ (WCAG)</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>
  <main class="tool">
    <h1>بررسی‌کننده کنتراست رنگ</h1>

    <div class="pickers">
      <div class="picker">
        <label for="text-color">رنگ متن</label>
        <input type="color" id="text-color" value="#1a3a5c">
        <code id="text-hex">#1a3a5c</code>
      </div>

      <button type="button" id="swap-btn">جابه‌جایی ⇄</button>

      <div class="picker">
        <label for="bg-color">رنگ پس‌زمینه</label>
        <input type="color" id="bg-color" value="#ffffff">
        <code id="bg-hex">#ffffff</code>
      </div>
    </div>

    <div class="preview" id="preview">
      <p class="preview-large">تیتر درشت نمونه</p>
      <p>این یک پاراگراف معمولی است تا ببینید متن کوچک روی این پس‌زمینه چقدر خوانا است.</p>
    </div>

    <p class="ratio">نسبت کنتراست: <strong id="ratio-out" dir="ltr">—</strong></p>
    <ul class="levels">
      <li id="level-aa"></li>
      <li id="level-aa-large"></li>
      <li id="level-aaa"></li>
    </ul>
  </main>
</body>

</html>
