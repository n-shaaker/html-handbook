<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مبدل هگز به RGB و HSL</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>
  <main class="tool">
    <h1>مبدل هگز به RGB و HSL</h1>

    <form id="hex-form">
      <label for="hex-input">کد هگز</label>
      <div class="row">
        <input type="text" id="hex-input" dir="ltr" placeholder="#ff8800" autocomplete="off">
        <button type="submit">تبدیل</button>
      </div>
      <p class="error" id="error-msg"></p>
    </form>

    <div class="preview" id="preview">پیش‌نمایش</div>

    <p>هگز: <code id="hex-out">—</code></p>
    <p>RGB: <code id="rgb-out">—</code></p>
    <p>HSL: <code id="hsl-out">—</code></p>
  </main>
</body>

</html>
