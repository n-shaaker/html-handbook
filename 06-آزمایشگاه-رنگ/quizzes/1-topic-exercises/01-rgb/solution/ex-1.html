<body>
  <main>
    <h1>جعبه رنگ‌های نوری (RGB)</h1>
    <div class="swatches">
      <div class="swatch red">rgb(255, 0, 0)</div>
      <div class="swatch green">rgb(0, 255, 0)</div>
      <div class="swatch blue">rgb(0, 0, 255)</div>
      <div class="swatch yellow">rgb(255, 255, 0)</div>
      <div class="swatch cyan">rgb(0, 255, 255)</div>
      <div class="swatch magenta">rgb(255, 0, 255)</div>
      <div class="swatch black">rgb(0, 0, 0)</div>
      <div class="swatch gray">rgb(128, 128, 128)</div>
      <div class="swatch white">rgb(255, 255, 255)</div>
    </div>
  </main>
