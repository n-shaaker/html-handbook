<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۲ — بنر با لایه شفاف</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ex-2.css">
</head>

<body>
  <main>
    <h1>بنر جشنواره تابستانه</h1>

    <div class="banner">
      <div class="box box-rgba">
        <h2>با rgba</h2>
        <p>فقط پس‌زمینه کادر نیمه‌شفاف است؛ متن کاملاً خواناست.</p>
      </div>

      <div class="box box-opacity">
        <h2>با opacity</h2>
        <p>کل کادر، حتی متن، کم‌رنگ شده است.</p>
      </div>
    </div>

    <p>
      کادر rgba خواناتر است، چون شفافیت فقط روی رنگ پس‌زمینه است؛
      opacity کل کادر و متن داخلش را با هم کم‌رنگ می‌کند.
    </p>

    <p><span class="badge">۳۰٪ تخفیف</span></p>
  </main>
</body>

</html>
