<body>
  <main>
    <h1>خوانایی کارت نقل‌قول</h1>

    <label for="bg-light">روشنایی پس‌زمینه: <span id="bg-value">95%</span></label>
    <input type="range" id="bg-light" min="0" max="100" value="95">

    <label for="text-light">روشنایی متن: <span id="text-value">20%</span></label>
    <input type="range" id="text-light" min="0" max="100" value="20">

    <blockquote class="result" id="quote-card">
      «توانا بود هر که دانا بود / ز دانش دل پیر برنا بود» — فردوسی
    </blockquote>

    <p id="status" aria-live="polite"></p>
  </main>
