<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۲ — نردبان روشنایی و اشباع</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
<link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ex-2.css">
</head>

<body>
  <main>
    <h1>آبی «دریا» در ده حالت</h1>

    <h2>نردبان روشنایی (فام ۲۱۰، اشباع ۷۰٪)</h2>
    <div class="swatches">
      <div class="swatch light-15">hsl(210, 70%, 15%)</div>
      <div class="swatch light-30">hsl(210, 70%, 30%)</div>
      <div class="swatch light-50">hsl(210, 70%, 50%)</div>
      <div class="swatch light-70">hsl(210, 70%, 70%)</div>
      <div class="swatch light-90">hsl(210, 70%, 90%)</div>
    </div>

    <h2>نردبان اشباع (فام ۲۱۰، روشنایی ۵۰٪)</h2>
    <div class="swatches">
      <div class="swatch sat-0">hsl(210, 0%, 50%)</div>
      <div class="swatch sat-25">hsl(210, 25%, 50%)</div>
      <div class="swatch sat-50">hsl(210, 50%, 50%)</div>
      <div class="swatch sat-75">hsl(210, 75%, 50%)</div>
      <div class="swatch sat-100">hsl(210, 100%, 50%)</div>
    </div>
  </main>
</body>

</html>
