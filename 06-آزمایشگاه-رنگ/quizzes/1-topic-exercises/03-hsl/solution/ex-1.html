<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۱ — چرخ رنگ با فام</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ex-1.css">
</head>

<body>
  <main>
    <h1>چرخ رنگ: فقط فام عوض می‌شود</h1>
    <div class="swatches">
      <div class="swatch hue-0">hsl(0, 100%, 50%)</div>
      <div class="swatch hue-60">hsl(60, 100%, 50%)</div>
      <div class="swatch hue-120">hsl(120, 100%, 50%)</div>
      <div class="swatch hue-180">hsl(180, 100%, 50%)</div>
      <div class="swatch hue-240">hsl(240, 100%, 50%)</div>
      <div class="swatch hue-300">hsl(300, 100%, 50%)</div>
      <div class="swatch hue-360">hsl(360, 100%, 50%)</div>
    </div>
    <p>فام زاویه روی چرخ رنگ است؛ ۳۶۰ درجه یعنی یک دور کامل، پس دوباره به همان قرمزِ ۰ درجه می‌رسیم.</p>
  </main>
</body>

</html>
