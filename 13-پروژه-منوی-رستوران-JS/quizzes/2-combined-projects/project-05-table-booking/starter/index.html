<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>رستوران نارنج | نوبت‌دهی میز</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
<link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <p class="logo">رستوران سنتی <strong>نارنج</strong></p>
    </header>

    <div class="container layout">
      <!-- ========== فرم رزرو ========== -->
      <main>
        <h1>نوبت‌دهی میز</h1>
        <p>هر سانس حداکثر ۲۰ مهمان دارد. ناهار ۱۲ تا ۱۶ و شام ۱۹ تا ۲۳.</p>

        <form class="reserve-form" id="booking-form" novalidate>
          <p>
            <label for="name">نام و نام خانوادگی</label>
            <input type="text" id="name" autocomplete="name" />
            <small class="field-error" id="name-error"></small>
          </p>
          <p>
            <label for="phone">شماره موبایل</label>
            <input type="tel" id="phone" dir="ltr" placeholder="09123456789" />
            <small class="field-error" id="phone-error"></small>
          </p>
          <p>
            <label for="date">تاریخ</label>
            <input type="date" id="date" />
            <small class="field-error" id="date-error"></small>
          </p>
          <p>
            <label for="session">سانس</label>
            <select id="session">
              <option value="lunch">ناهار (۱۲ تا ۱۶)</option>
              <option value="dinner">شام (۱۹ تا ۲۳)</option>
            </select>
            <small class="field-error" id="session-error"></small>
          </p>
          <p class="message" id="capacity" aria-live="polite">برای دیدن ظرفیت، تاریخ را انتخاب کنید.</p>
          <p>
            <label for="guests">تعداد نفرات (۱ تا ۱۰)</label>
            <input type="number" id="guests" min="1" max="10" value="2" />
            <small class="field-error" id="guests-error"></small>
          </p>
          <button type="submit" class="btn">ثبت رزرو</button>
        </form>
      </main>

      <!-- ========== فهرست رزروها ========== -->
      <aside class="cart" aria-labelledby="list-title">
        <h2 id="list-title">رزروهای ثبت‌شده</h2>
        <ul class="cart-list" id="booking-list"></ul>
      </aside>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
