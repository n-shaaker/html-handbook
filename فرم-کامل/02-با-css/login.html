<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود | فرم (CSS)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../shared/fonts.css" />
<link rel="stylesheet" href="css/forms.css">
</head>
<body>
  <p class="nav-bar">
    <a href="../index.html">خانه فرم کامل</a>
    ·
    <a href="index.html">فهرست این مرحله</a>
    ·
    <a href="../01-html-خالی/login.html">نسخه HTML خالی</a>
  </p>
  <p class="stage"><small>نسخه با CSS</small></p>
  <h1>فرم ورود</h1>

  <form action="#" method="post" autocomplete="on">
    <p>
      <label for="login-email">رایانامه یا نام کاربری</label><br>
      <input type="text" id="login-email" name="username" required autocomplete="username">
    </p>
    <p>
      <label for="login-pass">گذرواژه</label><br>
      <input type="password" id="login-pass" name="password" required minlength="8" autocomplete="current-password">
    </p>
    <p class="check-row">
      <input type="checkbox" id="remember" name="remember" value="1">
      <label for="remember">مرا به خاطر بسپار</label>
    </p>
    <p class="actions">
      <button type="submit">ورود</button>
    </p>
  </form>

</body>
</html>
