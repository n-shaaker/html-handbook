  <p class="nav-bar">

  <p class="stage"><small>HTML خالی — ظاهر پیش‌فرض مرورگر</small></p>
  <h1>فرم جستجو (method=get)</h1>

  <p class="hint">بعد از ارسال، پارامترها به انتهای آدرس اضافه می‌شوند.</p>
  <form action="" method="get">
    <p>
      <label for="q">عبارت جستجو</label><br>
      <input type="search" id="q" name="q" placeholder="مثلاً منوی رستوران" required>
    </p>
    <p>
      <label for="cat">دسته</label><br>
      <select id="cat" name="cat">
        <option value="all">همه</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="js">JavaScript</option>
      </select>
    </p>
    <p class="actions">
      <button type="submit">جستجو</button>
    </p>
  </form>

</body>
</html>
