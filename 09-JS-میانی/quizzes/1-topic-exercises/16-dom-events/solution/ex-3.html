    <li>
      <p>کسی کتاب خوبی برای یادگیری CSS می‌شناسد؟</p>

      <span class="likes">0</span>
    </li>
    <li>
      <p>عکس غروب امروز از بام تهران</p>
      <button type="button" class="like-btn">پسندیدم</button>
      <span class="likes">0</span>
    </li>
  </ul>

</html>
