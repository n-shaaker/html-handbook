<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۲ — ثبت‌نام باشگاه</title>
  <link rel="stylesheet" href="ex-2.css">
  <script src="ex-2.js" defer></script>
</head>

<body>
  <h1>ثبت‌نام باشگاه</h1>
  <form id="signup" novalidate>
    <label for="fullname">نام:</label>
    <input type="text" id="fullname" name="fullname">
    <p class="error" id="fullname-error"></p>

    <label for="age">سن:</label>
    <input type="number" id="age" name="age">
    <p class="error" id="age-error"></p>

    <label for="password">رمز عبور:</label>
    <input type="password" id="password" name="password">
    <p class="error" id="password-error"></p>

    <button type="submit">ثبت‌نام</button>
  </form>
  <p id="success" role="status"></p>
</body>

</html>
