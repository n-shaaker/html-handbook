<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محاسبه‌گر سن و تولد</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>
  <main class="card">
    <h1>🎂 چند سالته؟</h1>

    <form id="age-form" novalidate>
      <label for="birth-date">تاریخ تولد (میلادی):</label>
      <input type="date" id="birth-date" required>
      <button type="submit" class="btn">محاسبه</button>
    </form>

    <p id="error" class="error" role="alert"></p>

    <section id="result" class="result" aria-live="polite" hidden>
      <p>سن دقیق شما: <strong id="age-text"></strong></p>
      <p>روز تولد: <strong id="weekday-text"></strong></p>
      <p id="birthday-text"></p>

      <div class="fun-fact">
        <p id="fact-text"></p>
        <button type="button" id="fact-btn" class="btn btn-secondary">یک دانستنی دیگر</button>
      </div>
    </section>
  </main>
</body>

</html>
