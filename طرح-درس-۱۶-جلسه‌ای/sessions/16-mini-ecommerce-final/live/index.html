<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فروشگاه کوچک</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>فروشگاه کوچک</h1>
      <p class="cart-summary" aria-live="polite">سبد: <strong id="cart-count">۰</strong> کالا</p>
    </header>

    <section class="controls" role="search" aria-label="جستجو و فیلتر محصولات">
      <label>
        جستجو
        <input id="search" type="search" placeholder="جستجوی محصولات" autocomplete="off" />
      </label>
      <label>
        دسته‌بندی
        <select id="category">
          <option value="all">همه</option>
          <option value="tech">تکنولوژی</option>
          <option value="home">خانه</option>
          <option value="office">اداری</option>
        </select>
      </label>
    </section>

    <div class="layout">
      <main>
        <p id="result-count" class="result-count" aria-live="polite"></p>
        <div id="products" class="products"></div>
      </main>

      <aside class="cart" aria-labelledby="cart-title">
        <h2 id="cart-title">سبد خرید</h2>
        <ul id="cart-list"></ul>
        <p id="cart-empty" class="cart-empty">سبد خرید خالی است.</p>
        <p class="total">جمع: <span id="cart-total">۰</span> تومان</p>
        <button id="clear-cart" type="button">خالی کردن سبد</button>
      </aside>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
