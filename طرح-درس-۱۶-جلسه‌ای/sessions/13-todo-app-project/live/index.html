<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اپلیکیشن Todo</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../shared/fonts.css" />
<link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>لیست کارها</h1>

      <form id="todo-form" class="todo-form">
        <label class="sr-only" for="todo-input">کار جدید</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="چه کاری باید انجام شود؟"
          autocomplete="off"
          maxlength="120"
        />
        <button type="submit">افزودن</button>
      </form>

      <div class="filters" role="group" aria-label="فیلتر کارها">
        <button type="button" data-filter="all" class="is-active" aria-pressed="true">همه</button>
        <button type="button" data-filter="active" aria-pressed="false">فعال</button>
        <button type="button" data-filter="completed" aria-pressed="false">انجام‌شده</button>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="todo-empty" class="todo-empty" hidden></p>

      <footer class="todo-footer">
        <p id="todo-counter" aria-live="polite"></p>
        <button id="clear-completed" type="button">پاک کردن انجام‌شده‌ها</button>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
