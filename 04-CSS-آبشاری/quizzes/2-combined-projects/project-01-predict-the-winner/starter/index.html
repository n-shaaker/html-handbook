<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پروژه: برنده کیست؟</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <style>
      /* ===== استایل داخلی (بعد از دو فایل لینک‌شده) ===== */
      .card .text {
        color: brown;
      }

      .blue-text {
        color: blue;
      }

      .red-text {
        color: red;
      }

      #warn-box {
        color: crimson;
      }
    </style>
  </head>

  <body>
    <h1>برنده کیست؟</h1>
    <p class="hint">قبل از باز کردن این صفحه در مرورگر، رنگ هر عنصر را پیش‌بینی کنید.</p>

    <p class="red-text blue-text">عنصر ۱</p>

    <p class="msg">عنصر ۲</p>

    <div class="card">
      <p class="note">عنصر ۳</p>
      <p class="text">عنصر ۴</p>
      <p id="intro" class="text">عنصر ۵</p>
    </div>

    <div class="panel">
      <span>عنصر ۶</span>
      <em>عنصر ۷</em>
    </div>

    <p id="warn-box" class="warn" style="color: blue;">عنصر ۸</p>

    <p class="msg" style="color: black;">عنصر ۹</p>
  </body>
</html>
