<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>باشگاه کوهنوردی</title>
  </head>
  <body>
    <!--
      خطاهای اصلاح‌شده:
      ۱. DOCTYPE نبود.
      ۲. تگ html ویژگی lang و dir نداشت.
      ۳. title داخل body بود؛ به head منتقل شد.
      ۴. دو body وجود داشت؛ یکی شد.
      ۵. پاراگراف آخر بیرون از html بود؛ به داخل body آمد.
    -->
    <h1>برنامه صعود هفته</h1>
    <p>صعود به توچال، جمعه ساعت ۶ صبح.</p>
    <p>با تشکر، سرپرست گروه</p>
  </body>
</html>
