<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت مرسوله | پست سریع</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
</head>
  <body>
    <h1>ثبت مرسوله</h1>

    <form action="#" method="post">
      <p>
        <label for="receiver">نام گیرنده:</label>
        <input type="text" id="receiver" name="receiver" required minlength="3" maxlength="40" />
      </p>
      <p>
        <!-- [0-9]{10} یعنی دقیقاً ده رقم -->
        <label for="postcode">کد پستی:</label>
        <input
          type="text"
          id="postcode"
          name="postcode"
          required
          pattern="[0-9]{10}"
          title="کد پستی باید دقیقاً ۱۰ رقم باشد"
        />
      </p>
      <p>
        <label for="weight">وزن (کیلوگرم):</label>
        <input type="number" id="weight" name="weight" min="1" max="30" step="0.5" />
      </p>
      <p>
        <label for="send-date">تاریخ ارسال:</label>
        <input type="date" id="send-date" name="send-date" />
      </p>
      <p>
        <label for="mobile">موبایل:</label>
        <input type="tel" id="mobile" name="mobile" placeholder="09121234567" />
      </p>
      <p><button type="submit">ثبت</button></p>
    </form>
  </body>
</html>
