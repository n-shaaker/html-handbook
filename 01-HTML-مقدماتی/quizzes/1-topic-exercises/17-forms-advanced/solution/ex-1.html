<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سفارش | پیتزا نیکان</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
</head>
  <body>
    <h1>سفارش پیتزا</h1>

    <form action="#" method="get">
      <p>اندازه:</p>
      <p>
        <input type="radio" id="size-s" name="size" value="small" />
        <label for="size-s">کوچک</label>
        <input type="radio" id="size-m" name="size" value="medium" checked />
        <label for="size-m">متوسط</label>
        <input type="radio" id="size-l" name="size" value="large" />
        <label for="size-l">بزرگ</label>
      </p>

      <p>افزودنی‌ها:</p>
      <p>
        <input type="checkbox" id="extra-mushroom" name="extra" value="mushroom" />
        <label for="extra-mushroom">قارچ</label>
        <input type="checkbox" id="extra-olive" name="extra" value="olive" />
        <label for="extra-olive">زیتون</label>
        <input type="checkbox" id="extra-cheese" name="extra" value="cheese" />
        <label for="extra-cheese">پنیر اضافه</label>
      </p>

      <p><button type="submit">ثبت سفارش</button></p>
    </form>
  </body>
</html>
