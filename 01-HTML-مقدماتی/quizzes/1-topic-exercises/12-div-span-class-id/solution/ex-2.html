<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پیشنهادهای کتاب‌فروشی ققنوس</title>
    <style>
      .book-card {
        border: 1px solid #ccc;
        padding: 12px;
        margin: 10px 0;
      }
      #special {
        background-color: #fff8d6;
      }
    </style>
  </head>
  <body>
    <h1>پیشنهادهای این هفته</h1>

    <div class="book-card">
      <h2>شازده کوچولو</h2>
      <p>نویسنده: آنتوان دو سنت‌اگزوپری</p>
    </div>

    <!-- هم class مشترک دارد، هم id یکتا -->
    <div class="book-card" id="special">
      <h2>کیمیاگر (پیشنهاد ویژه)</h2>
      <p>نویسنده: پائولو کوئلیو</p>
    </div>

    <div class="book-card">
      <h2>سووشون</h2>
      <p>نویسنده: سیمین دانشور</p>
    </div>
  </body>
</html>
