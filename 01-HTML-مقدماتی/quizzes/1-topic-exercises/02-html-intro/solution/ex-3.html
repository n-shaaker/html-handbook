<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کتاب‌فروشی پاییز</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
</head>
  <body>
    <!--
      در عنصر <a href="https://example.com">سایت ما</a>:
      تگ: a
      ویژگی: href
      مقدار ویژگی: https://example.com
      محتوا: سایت ما
    -->
    <!-- تگ‌های تهی این کد: br و hr -->

    <h1>کتاب‌فروشی پاییز</h1>
    <p>
      ساعت کار: ۹ تا ۲۱<br />
      جمعه‌ها تعطیل
    </p>
    <p><a href="https://example.com">سایت ما</a></p>
    <hr />
  </body>
</html>
