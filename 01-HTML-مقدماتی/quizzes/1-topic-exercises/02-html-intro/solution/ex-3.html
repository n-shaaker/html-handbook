<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کتاب‌فروشی پاییز</title>
  </head>
  <body>
    <!--
      در عنصر <a href="https://example.com">سایت ما</a>:
      تگ: a
      ویژگی: href
      مقدار ویژگی: https://example.com
      محتوا: سایت ما
    -->
    <!-- تگ‌های تهی این کد: br و hr -->

    <h1>کتاب‌فروشی پاییز</h1>
    <p>
      ساعت کار: ۹ تا ۲۱<br />
      جمعه‌ها تعطیل
    </p>
    <p><a href="https://example.com">سایت ما</a></p>
    <hr />
  </body>
</html>
