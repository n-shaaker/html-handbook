<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اولین صفحه من</title>
  </head>
  <body>
    <!-- تیتر اصلی: نام من -->
    <h1>سارا احمدی</h1>

    <!-- پاراگراف اول: معرفی -->
    <p>من دانشجوی ترم دوم کامپیوتر هستم و تازه یادگیری طراحی وب را شروع کرده‌ام.</p>

    <!-- خط جداکننده (تگ تهی است و بسته نمی‌شود) -->
    <hr />

    <!-- پاراگراف دوم: علاقه‌مندی -->
    <p>دوست دارم یک روز سایت کتاب‌فروشی خودم را بسازم.</p>
  </body>
</html>
