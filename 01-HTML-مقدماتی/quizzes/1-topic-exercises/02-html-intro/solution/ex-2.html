<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اصلاح تودرتویی</title>
  </head>
  <body>
    <h1>اطلاعیه</h1>
    <!-- اشتباه: تگ p داخل h1 بسته شده بود و تیتر پایین صفحه بود -->

    <p>امروز <strong>کلاس <em>ساعت ۵</em></strong> شروع می‌شود.</p>
    <!-- اشتباه: em دیرتر باز شده بود، پس باید زودتر بسته شود -->

    <p>لطفاً <em>به موقع <strong>بیایید</strong></em>.</p>
    <!-- اشتباه: ترتیب بستن strong و em برعکس بود و تگ p هم بسته نشده بود -->
  </body>
</html>
