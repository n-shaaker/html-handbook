<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اصلاح تودرتویی</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
</head>
  <body>
    <h1>اطلاعیه</h1>
    <!-- اشتباه: تگ p داخل h1 بسته شده بود و تیتر پایین صفحه بود -->

    <p>امروز <strong>کلاس <em>ساعت ۵</em></strong> شروع می‌شود.</p>
    <!-- اشتباه: em دیرتر باز شده بود، پس باید زودتر بسته شود -->

    <p>لطفاً <em>به موقع <strong>بیایید</strong></em>.</p>
    <!-- اشتباه: ترتیب بستن strong و em برعکس بود و تگ p هم بسته نشده بود -->
  </body>
</html>
