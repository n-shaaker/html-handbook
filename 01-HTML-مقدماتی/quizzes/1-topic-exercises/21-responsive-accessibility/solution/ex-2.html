<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پیشنهاد ویژه | رستوران سنتی سرو</title>
    <style>
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .row > div {
        flex: 1 1 200px;
        border: 1px solid #ccc;
        padding: 12px;
        background-color: #fff8ee;
      }

      /* فقط در صفحه‌های باریک‌تر از ۶۰۰ پیکسل */
      @media (max-width: 600px) {
        .row > div {
          background-color: #e8f6ee;
        }
      }
    </style>
  </head>
  <body>
    <h1>پیشنهاد ویژه امروز</h1>

    <div class="row">
      <div>چلوکباب کوبیده — ۳۲۰ هزار تومان</div>
      <div>باقالی‌پلو با ماهیچه — ۴۵۰ هزار تومان</div>
      <div>دیزی سنگی — ۲۸۰ هزار تومان</div>
    </div>
  </body>
</html>
