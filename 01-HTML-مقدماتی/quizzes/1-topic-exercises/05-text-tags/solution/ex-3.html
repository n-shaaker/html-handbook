    <h1>اطلاعیه مجتمع مسکونی یاس</h1>

    <p><strong>آب ساختمان فردا از ساعت ۹ تا ۱۴ قطع است.</strong></p>

    <p>
      لطفاً <em>حتماً</em> قبل از ساعت ۹ شیرهای آب را ببندید و
      <mark>برای مصرف ضروری، ظرف آب ذخیره کنید</mark>.
    </p>

    <p>
      مدیر ساختمان گفت: <q>تعمیر لوله اصلی فقط پنج ساعت طول می‌کشد.</q>
    </p>

    <p><small>به‌روزرسانی: دیروز ساعت ۲۰</small></p>
