<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شعر روز | وبلاگ ادبی</title>
  </head>
  <body>
    <h1>شعر روز</h1>

    <!-- هر مصراع یک خط است، پس br داخل یک پاراگراف -->
    <p>
      بنی آدم اعضای یکدیگرند<br />
      که در آفرینش ز یک گوهرند<br />
      چو عضوی به درد آورد روزگار<br />
      دگر عضوها را نماند قرار
    </p>

    <hr />

    <blockquote>
      <p>کتاب‌ها مثل دوستانی هستند که هیچ‌وقت از شنیدن حرف‌هایت خسته نمی‌شوند و همیشه جوابی برایت دارند.</p>
    </blockquote>
    <p>— از یادداشت‌های یک کتابدار</p>
  </body>
</html>
