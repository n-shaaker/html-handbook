<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شیربرنج</title>
  </head>
  <body>
    <h1>شیربرنج خانگی</h1>

    <h2>خرید</h2>
    <ul>
      <li>یک پیمانه برنج</li>
      <li>یک لیتر شیر</li>
      <li>نصف پیمانه شکر</li>
      <li>دو قاشق گلاب</li>
    </ul>

    <h2>مراحل</h2>
    <ol>
      <li>برنج را بشویید و با دو لیوان آب بپزید.</li>
      <li>شیر را اضافه کنید و با حرارت کم هم بزنید.</li>
      <li>وقتی غلیظ شد، شکر را اضافه کنید.</li>
      <li>در آخر گلاب بریزید و در ظرف بکشید.</li>
    </ol>
  </body>
</html>
