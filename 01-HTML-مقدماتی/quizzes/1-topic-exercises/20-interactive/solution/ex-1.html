<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سؤالات متداول | فروشگاه کفش راه</title>
  </head>
  <body>
    <h1>سؤالات متداول</h1>

    <!-- open یعنی از ابتدا باز باشد -->
    <details open>
      <summary>ارسال سفارش چند روز طول می‌کشد؟</summary>
      <p>سفارش‌های تهران یک روزه و شهرستان‌ها دو تا چهار روز کاری ارسال می‌شوند.</p>
    </details>

    <details>
      <summary>اگر سایز کفش اندازه نبود چه کنم؟</summary>
      <p>تا هفت روز می‌توانید کفش را بدون هزینه تعویض کنید.</p>
    </details>

    <details>
      <summary>پرداخت در محل امکان دارد؟</summary>
      <p>بله، برای سفارش‌های زیر ۵ میلیون تومان پرداخت در محل ممکن است.</p>
    </details>
  </body>
</html>
