<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سبد خرید</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
</head>
  <body>
    <h1>سبد خرید</h1>

    <p id="item">
      هدفون بی‌سیم — ۱ میلیون و ۹۰۰ هزار تومان
      <button type="button" onclick="document.getElementById('confirm').showModal()">حذف</button>
    </p>

    <dialog id="confirm">
      <p>مطمئن هستید؟</p>
      <!-- method="dialog": هر دکمه داخل این فرم، پنجره را می‌بندد -->
      <form method="dialog">
        <button>انصراف</button>
        <button onclick="document.getElementById('item').hidden = true">بله، حذف شود</button>
      </form>
    </dialog>

    <noscript>برای حذف کالا، JavaScript را فعال کنید.</noscript>
  </body>
</html>
