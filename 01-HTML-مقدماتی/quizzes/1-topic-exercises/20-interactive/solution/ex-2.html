<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پنل هنرجو | آموزشگاه آنلاین مهارت</title>
  </head>
  <body>
    <h1>پنل هنرجو</h1>

    <!-- progress: پیشرفت یک کار تا پایان -->
    <p>
      <label for="course">پیشرفت دوره:</label>
      <progress id="course" value="12" max="20">۱۲ از ۲۰</progress>
      ۱۲ از ۲۰ جلسه
    </p>

    <!-- meter: یک مقدار در بازه؛ چون optimum پایین است، ۹۰٪ بد حساب می‌شود -->
    <p>
      <label for="disk">فضای پوشه تمرین‌ها:</label>
      <meter id="disk" value="0.9" low="0.3" high="0.8" optimum="0.1">۹۰٪</meter>
      ۹۰٪ پر شده
    </p>

    <p>جلسه بعد: <time datetime="2026-11-01T17:00">۱۰ آبان ۱۴۰۵ ساعت ۱۷</time></p>
  </body>
</html>
