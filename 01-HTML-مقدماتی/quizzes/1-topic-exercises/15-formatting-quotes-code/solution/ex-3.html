<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ذخیره فایل | ترفندهای VS Code</title>
  </head>
  <body>
    <h1>ذخیره سریع فایل در VS Code</h1>

    <p>برای ذخیره فایل، کلیدهای <kbd>Ctrl</kbd>+<kbd>S</kbd> را با هم بزنید.</p>

    <p>با این کد CSS، رنگ و اندازه تگ <code>h1</code> عوض می‌شود:</p>

    <!-- pre خط‌ها و فاصله‌ها را همان‌طور که نوشته شده نگه می‌دارد -->
    <pre><code>h1 {
  color: navy;
  font-size: 32px;
}</code></pre>

    <p>بعد از ذخیره، در نوار پایین این پیام را می‌بینید: <samp>File saved</samp></p>

    <p>یک فرمول ساده: مساحت مستطیل = <var>a</var> × <var>b</var></p>
  </body>
</html>
