<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوگوی کتاب‌فروشی ستاره</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
</head>
  <body>
    <h1>لوگوی کتاب‌فروشی ستاره</h1>

    <svg width="320" height="100" role="img" aria-label="لوگوی کتاب‌فروشی ستاره: مثلث طلایی و نام فروشگاه روی زمینه سرمه‌ای">
      <rect width="320" height="100" rx="12" fill="#1a3a5c" />
      <polygon points="50,20 85,70 15,70" fill="gold" />
      <line x1="15" y1="80" x2="85" y2="80" stroke="white" stroke-width="3" />
      <!-- صفحه راست‌به‌چپ است، پس متن از x=300 به سمت چپ نوشته می‌شود -->
      <text x="300" y="62" fill="white" font-size="26" font-family="Tahoma">کتاب‌فروشی ستاره</text>
    </svg>
  </body>
</html>
