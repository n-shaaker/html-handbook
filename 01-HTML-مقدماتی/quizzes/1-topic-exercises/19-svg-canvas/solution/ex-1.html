<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>چراغ راهنمایی</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
</head>
  <body>
    <h1>چراغ راهنمایی</h1>

    <svg width="120" height="300" role="img" aria-label="چراغ راهنمایی با سه رنگ قرمز، زرد و سبز">
      <!-- بدنه -->
      <rect x="10" y="10" width="100" height="280" rx="20" fill="#333" />
      <!-- سه چراغ: مرکز افقی ثابت، مرکز عمودی با فاصله ۹۰ -->
      <circle cx="60" cy="60" r="35" fill="red" />
      <circle cx="60" cy="150" r="35" fill="gold" />
      <circle cx="60" cy="240" r="35" fill="green" />
    </svg>
  </body>
</html>
