<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>درباره ما | کافه آلاله</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
</head>
  <body>
    <!-- تصویر لینک‌دار: alt مقصد لینک را می‌گوید -->
    <a href="#">
      <img src="../../../../images/demo.jpg" alt="صفحه اصلی کافه آلاله" width="80" height="60" />
    </a>

    <h1>درباره کافه آلاله</h1>

    <!-- تصویر اطلاعاتی: alt می‌گوید چه کسی و در چه حالی -->
    <img
      src="../../../../images/profile.jpg"
      alt="مریم نوری، مدیر کافه، با لبخند پشت پیشخوان"
      width="200"
      height="200"
    />
    <p>کافه آلاله از سال ۱۳۹۸ با مدیریت مریم نوری در شیراز فعالیت می‌کند.</p>

    <!-- تصویر تزئینی: هیچ اطلاعاتی ندارد، پس alt خالی تا صفحه‌خوان آن را رد کند -->
    <img src="../../../../images/demo.jpg" alt="" width="50" height="38" />

    <p>هر روز از ساعت ۸ صبح تا ۱۰ شب در خدمت شما هستیم.</p>
  </body>
</html>
