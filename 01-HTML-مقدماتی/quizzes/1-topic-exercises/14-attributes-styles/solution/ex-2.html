<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>رنگ برند | فروشگاه گل نسترن</title>
  </head>
  <body>
    <h1>رنگ اصلی برند نسترن</h1>

    <p style="background-color: mediumvioletred; color: white;">mediumvioletred</p>
    <p style="background-color: #c71585; color: white;">#c71585</p>
    <p style="background-color: rgb(199, 21, 133); color: white;">rgb(199, 21, 133)</p>
    <p style="background-color: hsl(322, 81%, 43%); color: white;">hsl(322, 81%, 43%)</p>

    <!-- عدد آخر rgba میزان شفافیت است (۰ تا ۱) -->
    <p style="background-color: rgba(199, 21, 133, 0.3);">rgba(199, 21, 133, 0.3)</p>
  </body>
</html>
