<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فاکتور سفارش | کتاب‌سرای پارسه</title>
    <style>
      table {
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #999;
        padding: 6px 12px;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
</head>
  <body>
    <h1>کتاب‌سرای پارسه</h1>

    <table>
      <caption>فاکتور سفارش شماره ۱۰۲۴</caption>
      <!-- سه ستون اول عادی، ستون چهارم رنگی -->
      <colgroup>
        <col span="3" />
        <col style="background-color: #e8f4fd" />
      </colgroup>
      <thead>
        <tr>
          <th scope="col">کتاب</th>
          <th scope="col">تعداد</th>
          <th scope="col">قیمت واحد (تومان)</th>
          <th scope="col">قیمت کل (تومان)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>سووشون</td>
          <td>۲</td>
          <td>۱۵۰٬۰۰۰</td>
          <td>۳۰۰٬۰۰۰</td>
        </tr>
        <tr>
          <td>کلیدر (جلد ۱)</td>
          <td>۱</td>
          <td>۲۲۰٬۰۰۰</td>
          <td>۲۲۰٬۰۰۰</td>
        </tr>
        <tr>
          <td>شازده کوچولو</td>
          <td>۳</td>
          <td>۸۰٬۰۰۰</td>
          <td>۲۴۰٬۰۰۰</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th scope="row" colspan="3">جمع کل</th>
          <td>۷۶۰٬۰۰۰</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
