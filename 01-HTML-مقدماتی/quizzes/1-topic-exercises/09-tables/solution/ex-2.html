<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کارنامه نیما کاظمی</title>
    <style>
      table {
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #999;
        padding: 6px 12px;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
</head>
  <body>
    <h1>کارنامه نیما کاظمی</h1>

    <table>
      <caption>نمره‌های سال تحصیلی ۱۴۰۴–۱۴۰۵</caption>
      <thead>
        <tr>
          <th scope="col">نیم‌سال</th>
          <th scope="col">درس</th>
          <th scope="col">نمره</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row" rowspan="2">نیم‌سال اول</th>
          <td>ریاضی</td>
          <td>۱۸</td>
        </tr>
        <!-- این ردیف یک خانه کمتر دارد چون خانه نیم‌سال از بالا آمده -->
        <tr>
          <td>علوم</td>
          <td>۱۷</td>
        </tr>
        <tr>
          <th scope="row" rowspan="2">نیم‌سال دوم</th>
          <td>ریاضی</td>
          <td>۱۹</td>
        </tr>
        <tr>
          <td>علوم</td>
          <td>۲۰</td>
        </tr>
        <tr>
          <th scope="row" colspan="2">معدل کل</th>
          <td>۱۸٫۵</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
