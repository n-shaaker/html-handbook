<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live — ساختار سند HTML5</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, "Vazirmatn", sans-serif;
      margin: 0;
      padding: 1.5rem;
      line-height: 1.7;
      background: #f8fafc;
    }
    .note {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      padding: 0.75rem 1rem;
      border-radius: 0.35rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <p class="note">این فایل برای درس ۵ است — در کلاس خط‌به‌خط از <code>&lt;!DOCTYPE&gt;</code> تا <code>&lt;/html&gt;</code> بسازید.</p>
  <h1>سلام دنیا</h1>
  <p>محتوای دیدنی فقط داخل <strong>body</strong> است.</p>
  <!-- title در head است، نه اینجا -->
</body>
</html>
