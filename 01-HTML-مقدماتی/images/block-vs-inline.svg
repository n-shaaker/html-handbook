<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img">
  <title>Block vs Inline</title>
  <rect width="480" height="200" fill="#f4f7fb"/>
  <text x="240" y="22" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="14" fill="#1a3a5c">Block vs Inline</text>

  <text x="120" y="48" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13" font-weight="bold" fill="#0b6e4f">Block</text>
  <rect x="30" y="58" width="180" height="36" rx="4" fill="#1a5fb4"/>
  <text x="120" y="81" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="12" fill="#ffffff">div / p - line 1</text>
  <rect x="30" y="102" width="180" height="36" rx="4" fill="#1a5fb4"/>
  <text x="120" y="125" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="12" fill="#ffffff">div / p - line 2</text>
  <text x="120" y="158" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="11" fill="#445555">new line + full width</text>

  <text x="360" y="48" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13" font-weight="bold" fill="#0b6e4f">Inline</text>
  <rect x="260" y="70" width="200" height="50" rx="4" fill="#ffffff" stroke="#cfd8e3"/>
  <rect x="272" y="84" width="52" height="24" rx="3" fill="#e8590c"/>
  <text x="298" y="100" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="11" fill="#ffffff">span</text>
  <rect x="332" y="84" width="52" height="24" rx="3" fill="#e8590c"/>
  <text x="358" y="100" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="11" fill="#ffffff">span</text>
  <rect x="392" y="84" width="52" height="24" rx="3" fill="#e8590c"/>
  <text x="418" y="100" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="11" fill="#ffffff">a</text>
  <text x="360" y="158" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="11" fill="#445555">same line + content width</text>

  <line x1="240" y1="50" x2="240" y2="170" stroke="#cfd8e3" stroke-dasharray="4 4"/>
</svg>
