<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تمرین ۲ — فرم ثبت‌نام</title>
    <link rel="stylesheet" href="style.css" />
    <script src="ex-2.js" defer></script>
  </head>
  <body>
    <main class="box">
      <h1>تمرین ۲ — ثبت‌نام در انجمن</h1>
      <form id="signup-form" novalidate>
        <label for="username">نام کاربری (انگلیسی):</label>
        <input type="text" id="username" dir="ltr" />
        <p class="error" id="username-error"></p>

        <label for="postal">کد پستی:</label>
        <input type="text" id="postal" dir="ltr" />
        <p class="error" id="postal-error"></p>

        <label for="email">ایمیل:</label>
        <input type="email" id="email" dir="ltr" />
        <p class="error" id="email-error"></p>

        <button type="submit">ثبت‌نام</button>
      </form>
      <p class="success" id="result" aria-live="polite"></p>
    </main>
  </body>
</html>
