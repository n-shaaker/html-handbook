<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تمرین ۳ — هشتگ‌یاب</title>
    <link rel="stylesheet" href="style.css" />
    <script src="ex-3.js" defer></script>
  </head>
  <body>
    <main class="box">
      <h1>تمرین ۳ — بررسی نظر قبل از انتشار</h1>
      <label for="comment">متن نظر:</label>
      <textarea id="comment" rows="4"></textarea>
      <button type="button" id="check">بررسی متن</button>

      <h2>هشتگ‌ها</h2>
      <p id="tag-count" aria-live="polite"></p>
      <ul id="tag-list"></ul>

      <h2>متن قابل انتشار</h2>
      <p class="output" id="safe-text"></p>
    </main>
  </body>
</html>
