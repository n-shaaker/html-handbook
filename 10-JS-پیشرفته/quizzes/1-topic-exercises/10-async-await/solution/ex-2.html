<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تمرین ۲ — ورود</title>
    <link rel="stylesheet" href="style.css" />
    <script src="ex-2.js" defer></script>
  </head>
  <body>
    <main class="box">
      <h1>تمرین ۲ — ورود به سامانه</h1>
      <form id="login-form">
        <label for="username">نام کاربری:</label>
        <input type="text" id="username" dir="ltr" autocomplete="username" />
        <label for="password">رمز عبور:</label>
        <input type="password" id="password" dir="ltr" autocomplete="current-password" />
        <button type="submit" id="submit">ورود</button>
      </form>
      <p class="output" id="output" aria-live="polite"></p>
    </main>
  </body>
</html>
