<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تمرین ۳ — حساب پس‌انداز</title>
    <link rel="stylesheet" href="style.css" />
    <script src="ex-3.js" defer></script>
  </head>
  <body>
    <main class="box">
      <h1>تمرین ۳ — حساب پس‌انداز</h1>
      <label for="amount">مبلغ (تومان):</label>
      <input type="number" id="amount" />
      <button type="button" id="deposit">واریز</button>
      <button type="button" id="withdraw">برداشت</button>
      <button type="button" id="interest">افزودن سود ۲۰٪</button>
      <p class="error" id="message" role="alert"></p>
      <p id="balance" aria-live="polite"></p>
    </main>
  </body>
</html>
