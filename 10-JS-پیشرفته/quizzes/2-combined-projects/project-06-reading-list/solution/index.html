<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کتاب‌های من | باشگاه کتاب‌خوانی</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <h1>📚 کتاب‌های من</h1>

      <form id="book-form" class="book-form" novalidate>
        <p>
          <label for="title">عنوان کتاب</label>
          <input type="text" id="title" />
          <small class="field-error" id="title-error"></small>
        </p>
        <p>
          <label for="author">نویسنده</label>
          <input type="text" id="author" />
          <small class="field-error" id="author-error"></small>
        </p>
        <p>
          <label for="isbn">شابک (ISBN)</label>
          <input type="text" id="isbn" dir="ltr" placeholder="978-964-6194-71-5" />
          <small class="field-error" id="isbn-error"></small>
        </p>
        <button type="submit">افزودن کتاب</button>
      </form>

      <p class="stats" id="stats" aria-live="polite"></p>
      <ul class="book-list" id="book-list"></ul>
    </main>
  </body>
</html>
