<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تمرین ۳ — فرم کامل رزرو | منوی نارنج</title>
    <link rel="stylesheet" href="style.css" />
    <script src="ex-3.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <p class="logo">رستوران سنتی <strong>نارنج</strong></p>
    </header>

    <main class="container">
      <h1>تمرین ۳ — فرم کامل رزرو</h1>

      <form class="reserve-form" id="reserve-form" novalidate>
        <p>
          <label for="name">نام و نام خانوادگی</label>
          <input type="text" id="name" autocomplete="name" />
          <small class="field-error" id="name-error"></small>
        </p>
        <p>
          <label for="phone">شماره موبایل</label>
          <input type="tel" id="phone" dir="ltr" placeholder="09123456789" />
          <small class="field-error" id="phone-error"></small>
        </p>
        <p>
          <label for="guests">تعداد نفرات</label>
          <input type="number" id="guests" min="1" max="20" value="2" />
          <small class="field-error" id="guests-error"></small>
        </p>
        <p>
          <label for="note">توضیحات (اختیاری، حداکثر ۲۰۰ حرف)</label>
          <textarea id="note" rows="3" placeholder="مثلاً: جشن تولد داریم"></textarea>
          <small id="note-count">۰ / ۲۰۰</small>
          <small class="field-error" id="note-error"></small>
        </p>
        <button type="submit" class="btn">ثبت رزرو</button>
        <p class="form-message" id="form-message" aria-live="polite"></p>
      </form>

    </main>
  </body>
</html>
