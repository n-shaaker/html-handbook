<!doctype html>
<html lang="fa" dir="rtl">
  <head>

    <link rel="stylesheet" href="style.css" />

  </head>
  <body>

      <p class="logo">رستوران سنتی <strong>نارنج</strong></p>

    <main class="container">

        <input type="datetime-local" id="test-time" />

        <p id="time-result" aria-live="polite"></p>
      </section>

    </main>
