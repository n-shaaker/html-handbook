<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>رزرو میز | رستوران نارنج</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
<link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <p class="logo">رستوران سنتی <strong>نارنج</strong></p>
    </header>

    <main class="container">
      <h1>رزرو میز</h1>
      <p>فرم زیر را پر کنید؛ برای تأیید رزرو با شما تماس می‌گیریم.</p>

      <!-- هر <small class="field-error"> جای پیام خطای کادر بالایش است -->
      <form class="reserve-form" id="reserve-form" action="#" method="post" novalidate>
        <div class="field">
          <label for="name">نام و نام خانوادگی</label>
          <input type="text" id="name" name="name" autocomplete="name" />
          <small class="field-error" id="name-error"></small>
        </div>

        <div class="field">
          <label for="phone">شماره موبایل</label>
          <input type="tel" id="phone" name="phone" placeholder="09123456789" dir="ltr" />
          <small class="field-error" id="phone-error"></small>
        </div>

        <div class="field">
          <label for="date">تاریخ</label>
          <input type="date" id="date" name="date" />
          <small class="field-error" id="date-error"></small>
        </div>

        <div class="field">
          <label for="guests">تعداد نفرات</label>
          <input type="number" id="guests" name="guests" min="1" max="20" value="2" />
          <small class="field-error" id="guests-error"></small>
        </div>

        <div class="field">
          <label for="area">محل نشستن</label>
          <select id="area" name="area">
            <option value="hall">سالن اصلی</option>
            <option value="bed">تخت سنتی</option>
            <option value="yard">حیاط</option>
          </select>
        </div>

        <button type="submit" class="btn">ثبت رزرو</button>
        <p class="form-message" id="form-message" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
