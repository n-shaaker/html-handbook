<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کارنامه نمره | آموزشگاه پرتو</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>

  <main class="panel">
    <h1>کارنامه آزمون — آموزشگاه پرتو</h1>

    <div class="field">
      <label for="student-name">نام دانشجو</label>
      <input type="text" id="student-name" autocomplete="off" placeholder="مثلاً سارا رضایی">
    </div>

    <div class="field">
      <label for="score">نمره (۰ تا ۲۰)</label>
      <input type="number" id="score" min="0" max="20" step="0.01">
    </div>

    <button type="button" class="btn" id="show-btn">نمایش کارنامه</button>

    <section class="output" aria-live="polite">
      <p class="msg-error" id="error-msg"></p>

      <div class="report-card hidden" id="report-card">
        <p class="report-text" id="report-text"></p>
      </div>
    </section>
  </main>

</body>

</html>
