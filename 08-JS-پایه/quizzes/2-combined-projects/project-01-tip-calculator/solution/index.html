<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماشین‌حساب انعام و تقسیم صورتحساب</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>

  <main class="card">
    <h1>تقسیم صورتحساب 🧾</h1>
    <p class="intro">مبلغ، درصد انعام و تعداد نفرات را وارد کنید تا سهم هر نفر را ببینید.</p>

    <div class="field">
      <label for="bill">مبلغ صورتحساب (تومان)</label>
      <input type="number" id="bill" min="1" placeholder="مثلاً 850000">
    </div>

    <div class="field">
      <label for="tip-percent">درصد انعام</label>
      <select id="tip-percent">
        <option value="0">بدون انعام</option>
        <option value="10" selected>۱۰ درصد</option>
        <option value="15">۱۵ درصد</option>
        <option value="20">۲۰ درصد</option>
      </select>
    </div>

    <div class="field">
      <label for="people">تعداد نفرات</label>
      <input type="number" id="people" min="1" step="1" value="2">
    </div>

    <button type="button" class="btn" id="calc-btn">محاسبه</button>

    <section class="output" aria-live="polite">
      <p id="message"></p>

      <dl class="result hidden" id="result">
        <dt>مبلغ انعام</dt>
        <dd id="tip-out"></dd>
        <dt>جمع کل</dt>
        <dd id="total-out"></dd>
        <dt>سهم هر نفر</dt>
        <dd id="per-person-out" class="highlight"></dd>
      </dl>
    </section>
  </main>

</body>

</html>
