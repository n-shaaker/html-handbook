<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۳ — سود سپرده بانکی</title>
  <link rel="stylesheet" href="style.css">
  <script src="ex-3.js" defer></script>
</head>

<body>
  <main>
    <h1>محاسبه سود سپرده 🏦</h1>

    <label for="amount">مبلغ سپرده (تومان)</label>
    <input type="number" id="amount" min="0" value="10000000">

    <label for="percent">سود سالانه (درصد)</label>
    <input type="number" id="percent" min="0" step="0.5" value="20">

    <label for="months">مدت (ماه)</label>
    <input type="number" id="months" min="1" value="6">

    <button type="button" id="calc-btn">محاسبه</button>

    <div class="result">
      <p id="profit-out"></p>
      <p id="total-out"></p>
    </div>
  </main>
</body>

</html>
