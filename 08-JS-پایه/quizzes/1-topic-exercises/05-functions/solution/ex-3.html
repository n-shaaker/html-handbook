<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۳ — قیمت فرش</title>
  <link rel="stylesheet" href="style.css">
  <script src="ex-3.js" defer></script>
</head>

<body>
  <main>
    <h1>محاسبه قیمت فرش 🧶</h1>

    <label for="rug-length">طول فرش (متر)</label>
    <input type="number" id="rug-length" min="0" step="0.5" value="3">

    <label for="rug-width">عرض فرش (متر)</label>
    <input type="number" id="rug-width" min="0" step="0.5" value="2">

    <label for="meter-price">قیمت هر متر مربع (تومان)</label>
    <input type="number" id="meter-price" min="0" value="1200000">

    <button type="button" id="calc-btn">محاسبه</button>

    <p id="result" class="result"></p>
  </main>
</body>

</html>
