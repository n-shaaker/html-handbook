<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۳ — جمع با و بدون Number()</title>
  <link rel="stylesheet" href="style.css">
  <script src="ex-3.js" defer></script>
</head>

<body>
  <main>
    <h1>جمع دو عدد: با و بدون تبدیل</h1>

    <label for="first">عدد اول</label>
    <input type="number" id="first" value="10">

    <label for="second">عدد دوم</label>
    <input type="number" id="second" value="5">

    <button type="button" id="add-btn">جمع کن</button>

    <div class="result">
      <p id="wrong-out" class="error"></p>
      <p id="right-out" class="ok"></p>
      <p id="type-out"></p>
    </div>
  </main>
</body>

</html>
