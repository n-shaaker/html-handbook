<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۳ — عکس‌ها و جدول با پاورقی</title>
  <link rel="stylesheet" href="ex-3.css">
</head>

<body>
  <section id="drinks">
    <h2>نوشیدنی</h2>
    <figure class="drinks-photos">
      <img src="../../../../images/tea.jpg" alt="استکان چای ایرانی">
      <img src="../../../../images/doogh.jpg" alt="دوغ محلی با برگ نعنا در کاسه‌های مسی">
      <figcaption>چای تازه‌دم و دوغ محلی، دو نوشیدنی محبوب مهمان‌های ما</figcaption>
    </figure>

    <table>
      <caption>فهرست قیمت نوشیدنی‌ها</caption>
      <thead>
        <tr>
          <th scope="col">نوشیدنی</th>
          <th scope="col">توضیح</th>
          <th scope="col">قیمت (تومان)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">چای سنتی</th>
          <td>قوری دونفره، با نبات یا خرما</td>
          <td><data value="60000">۶۰٬۰۰۰</data></td>
        </tr>
        <tr>
          <th scope="row">دوغ محلی</th>
          <td>با پونه و نعنا</td>
          <td><data value="45000">۴۵٬۰۰۰</data></td>
        </tr>
        <tr class="today">
          <th scope="row">شربت بهارنارنج <mark>پیشنهاد امروز</mark></th>
          <td>خنک، بدون گاز</td>
          <td><data value="55000">۵۵٬۰۰۰</data></td>
        </tr>
        <tr>
          <th scope="row">دمنوش گل‌گاوزبان</th>
          <td>با لیمو عمانی</td>
          <td><data value="50000">۵۰٬۰۰۰</data></td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="3">قیمت‌ها با احتساب ۱۰٪ مالیات است.</td>
        </tr>
      </tfoot>
    </table>
  </section>
</body>

</html>
