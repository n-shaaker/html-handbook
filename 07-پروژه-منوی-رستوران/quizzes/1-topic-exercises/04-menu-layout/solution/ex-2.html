<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۲ — جدول کارت‌ها با Grid</title>
  <link rel="stylesheet" href="ex-2.css">
</head>

<body>
  <section id="starters">
    <h2>پیش‌غذا و دسر</h2>
    <div class="dishes-grid">
      <article class="dish">
        <img src="../../../../images/mirza.jpg" alt="میرزاقاسمی با نان و سبزی">
        <h3>میرزاقاسمی</h3>
        <p class="price">۱۸۵٬۰۰۰ تومان</p>
      </article>
      <article class="dish">
        <img src="../../../../images/shirazi.jpg" alt="سالاد شیرازی در کاسه">
        <h3>سالاد شیرازی</h3>
        <p class="price">۷۵٬۰۰۰ تومان</p>
      </article>
      <article class="dish">
        <img src="../../../../images/faloodeh.jpg" alt="فالوده شیرازی در جام شیشه‌ای">
        <h3>فالوده شیرازی</h3>
        <p class="price">۹۰٬۰۰۰ تومان</p>
      </article>
      <article class="dish">
        <img src="../../../../images/sholehzard.jpg" alt="شله‌زرد تزیین‌شده با دارچین">
        <h3>شله‌زرد</h3>
        <p class="price">۷۰٬۰۰۰ تومان</p>
      </article>
      <article class="dish">
        <img src="../../../../images/tea.jpg" alt="استکان چای ایرانی">
        <h3>چای سنتی</h3>
        <p class="price">۶۰٬۰۰۰ تومان</p>
      </article>
    </div>
  </section>
</body>

</html>
