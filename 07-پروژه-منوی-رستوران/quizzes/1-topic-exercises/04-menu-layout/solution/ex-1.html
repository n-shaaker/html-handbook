<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۱ — ردیف کارت‌ها با Flexbox</title>
  <link rel="stylesheet" href="ex-1.css">
</head>

<body>
  <section id="mains">
    <h2>غذای اصلی</h2>
    <div class="dishes-flex">
      <article class="dish">
        <img src="../../../../images/koobideh.jpg" alt="کباب کوبیده در بشقاب با گوجه کبابی">
        <h3>چلوکباب کوبیده</h3>
        <p class="price">۴۲۰٬۰۰۰ تومان</p>
      </article>
      <article class="dish">
        <img src="../../../../images/joojeh.jpg" alt="جوجه‌کباب زعفرانی روی سیخ">
        <h3>چلوجوجه‌کباب</h3>
        <p class="price">۳۸۰٬۰۰۰ تومان</p>
      </article>
      <article class="dish">
        <img src="../../../../images/ghormeh.jpg" alt="خورش قورمه‌سبزی کنار برنج">
        <h3>چلوخورش قورمه‌سبزی</h3>
        <p class="price">۳۲۰٬۰۰۰ تومان</p>
      </article>
      <article class="dish">
        <img src="../../../../images/zereshk.jpg" alt="زرشک‌پلو با مرغ">
        <h3>زرشک‌پلو با مرغ</h3>
        <p class="price">۳۵۰٬۰۰۰ تومان</p>
      </article>
    </div>
  </section>
</body>

</html>
