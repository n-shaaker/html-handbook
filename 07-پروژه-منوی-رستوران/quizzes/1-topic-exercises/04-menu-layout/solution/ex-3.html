<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۳ — یک بخش کامل منو</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../../../shared/fonts.css" />
<link rel="stylesheet" href="ex-3.css">
</head>

<body>
  <main class="container">
    <section id="starters">
      <h2>پیش‌غذا</h2>
      <p class="note">همه پیش‌غذاها با نان تازه سرو می‌شوند.</p>

      <dl class="legend">
        <dt><span class="tag tag-veg">گیاهی</span></dt>
        <dd>بدون گوشت</dd>
        <dt><span class="tag tag-hot">تند</span></dt>
        <dd>کمی تند؛ هنگام سفارش بگویید اگر تند دوست ندارید</dd>
        <dt><mark>جدید</mark></dt>
        <dd>تازه به منو اضافه شده</dd>
      </dl>

      <div class="dishes-grid">
        <article class="dish">
          <img src="../../../../images/mirza.jpg" alt="میرزاقاسمی با نان و سبزی">
          <h3>میرزاقاسمی <span class="tag tag-veg">گیاهی</span></h3>
          <p class="price">۱۸۵٬۰۰۰ تومان</p>
        </article>
        <article class="dish">
          <img src="../../../../images/shirazi.jpg" alt="سالاد شیرازی در کاسه">
          <h3>سالاد شیرازی <span class="tag tag-veg">گیاهی</span></h3>
          <p class="price">۷۵٬۰۰۰ تومان</p>
        </article>
        <article class="dish">
          <img src="../../../../images/joojeh.jpg" alt="جوجه‌کباب زعفرانی روی سیخ">
          <h3>بال کبابی <span class="tag tag-hot">تند</span> <mark>جدید</mark></h3>
          <p class="price">۱۶۵٬۰۰۰ تومان</p>
        </article>
      </div>
    </section>
  </main>
</body>

</html>
