<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۲ — قانون‌های رزرو</title>
  <link rel="stylesheet" href="ex-2.css">
</head>

<body>
  <h1>رزرو میز</h1>
  <form action="#" method="post">
    <label for="name">نام و نام خانوادگی</label>
    <input type="text" id="name" name="name" required>

    <label for="phone">شماره موبایل</label>
    <input type="tel" id="phone" name="phone" dir="ltr" placeholder="09123456789"
      pattern="09[0-9]{9}" title="شماره موبایل ۱۱ رقمی که با ۰۹ شروع می‌شود" required>

    <label for="date">تاریخ</label>
    <input type="date" id="date" name="date" required>

    <label for="time">ساعت (۱۲ تا ۲۳)</label>
    <input type="time" id="time" name="time" min="12:00" max="23:00" required>

    <label for="guests">تعداد نفرات</label>
    <input type="number" id="guests" name="guests" min="1" max="20" value="2">

    <label for="area">محل نشستن</label>
    <select id="area" name="area">
      <option value="hall">سالن اصلی</option>
      <option value="bed">تخت سنتی</option>
      <option value="yard">حیاط</option>
    </select>

    <button type="submit">ثبت رزرو</button>
  </form>
</body>

</html>
