<body>
  <section>
    <h2>پرسش‌های پرتکرار</h2>
    <details>
      <summary>آیا غذای بیرون‌بر دارید؟</summary>
      <p>بله، همه غذاهای منو را می‌توانید بیرون‌بر سفارش دهید.</p>
    </details>
    <details>
      <summary>برای جمع‌های بزرگ باید زودتر رزرو کنیم؟</summary>
      <p>برای بیشتر از ۱۰ نفر، لطفاً دست‌کم یک روز قبل رزرو کنید.</p>
    </details>
    <details>
      <summary>پارکینگ دارید؟</summary>
      <p>بله، پارکینگ رایگان برای مهمان‌ها داریم.</p>
    </details>
  </section>
