<body>
  <main class="recipe">
    <h1>کوکو سبزی</h1>
    <ol class="steps">
      <li>سبزی‌ها را بشویید، خشک کنید و ریز خرد کنید.</li>
      <li>تخم‌مرغ‌ها را با نمک، فلفل و زردچوبه هم بزنید.</li>
      <li>سبزی، گردو و زرشک را به تخم‌مرغ اضافه کنید.</li>
      <li>مایه را در تابه روغن‌دار بریزید و درش را بگذارید.</li>
      <li>بعد از ۲۰ دقیقه آن را برگردانید تا طرف دیگر هم سرخ شود.</li>
    </ol>
  </main>
