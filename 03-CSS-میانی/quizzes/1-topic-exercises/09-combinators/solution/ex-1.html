<body>
  <article>
    <h1>فواید پیاده‌روی روزانه</h1>
    <p>فقط سی دقیقه پیاده‌روی در روز، قلب را قوی‌تر و خواب را عمیق‌تر می‌کند.</p>
    <blockquote>
      <p>«بهترین ورزش، ورزشی است که هر روز انجامش دهید.»</p>
    </blockquote>
    <p>اگر وقت ندارید، مسیر خانه تا ایستگاه مترو را پیاده بروید.</p>
    <p>کفش راحت و یک بطری آب، تنها چیزهایی است که لازم دارید.</p>
  </article>
</body>
