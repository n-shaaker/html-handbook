<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمرین ۲ — فرم درخواست همکاری</title>
  <link rel="stylesheet" href="ex-2.css">
</head>
<body>
  <form action="#">
    <h1>درخواست همکاری</h1>

    <label for="name">نام و نام خانوادگی</label>
    <input type="text" id="name" name="name" required>

    <label for="email">ایمیل</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">تلفن (اختیاری)</label>
    <input type="tel" id="phone" name="phone">

    <p>
      <input type="checkbox" id="news" name="news">
      <label for="news">خبرنامه فرصت‌های شغلی را برایم بفرستید</label>
    </p>

    <input type="submit" value="ارسال درخواست">
  </form>
</body>
</html>
